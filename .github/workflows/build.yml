name: Build project with Maven
on:
  pull_request: 
  push: 
  schedule:
  - cron: '2 2 * * 1-5' # run nightly master builds on weekdays
  workflow_dispatch: # can be used to trigger the workflow manually

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Start Keycloak
      run: |
        docker run -d \
          --name keycloak \
          -p 8080:8080 \
          -p 9000:9000 \
          -e KEYCLOAK_ADMIN=keycloak \
          -e KEYCLOAK_ADMIN_PASSWORD='keycloak1!' \
          quay.io/keycloak/keycloak:26.1.2 start-dev --health-enabled=true
    - name: Checkout
      uses: actions/checkout@v6
    - name: Java setup
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
    - name: Cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # pin@v2
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Wait for Keycloak to be ready
      run: |
        echo "Waiting for Keycloak to be ready..."
        timeout 120 bash -c 'until curl -sf http://localhost:9000/health/ready; do sleep 2; done'
    - name: Keycloak logs (debug)
      if: failure()
      run: docker logs keycloak
    - name: Run Maven
      env:
        KEYCLOAK_URL: http://localhost:8080/auth        
        KEYCLOAK_USER: keycloak
        KEYCLOAK_PASSWORD: keycloak1!
        KEYCLOAK_ENFORCE_SUBGROUPS_IN_GROUP_QUERY: false
      run: mvn -B clean install com.mycila:license-maven-plugin:check
